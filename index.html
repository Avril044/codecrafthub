<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeCraftHub: Your Learning Management Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .card-hover { transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 32px -8px rgba(15, 23, 42, 0.18); }
    .btn-primary {
      background: #8B5CF6;
      color: white;
      padding: 0.625rem 1.25rem;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background: #7C3AED;
    }
    .btn-success {
      background: #F59E0B;
      color: white;
      padding: 0.625rem 1.25rem;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }
    .btn-success:hover {
      background: #D97706;
    }
    .btn-danger {
      background: #dc2626;
      color: white;
      padding: 0.625rem 1.25rem;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }
    .btn-danger:hover {
      background: #b91c1c;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased">
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <h1 class="font-bold tracking-tight">CodeCraftHub: Your Learning Management Platform</h1>
      <button id="btnNewCourse" class="btn-primary">Nuevo Curso</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <section id="statsSection" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></section>
    <section class="bg-white rounded-2xl border p-5 mb-6 flex gap-3">
      <input id="searchInput" placeholder="Buscar por título..." class="flex-1 border rounded-xl px-3 py-2.5 text-sm" />
      <select id="statusFilter" class="border rounded-xl px-3 py-2.5 text-sm bg-white">
        <option value="">Todos los estados</option>
        <option value="planned">Planificado</option>
        <option value="in-progress">En progreso</option>
        <option value="completed">Completado</option>
      </select>
    </section>
    <section id="coursesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></section>
    <div id="emptyState" class="hidden text-center py-20 font-semibold">No se encontraron cursos</div>
  </main>

  <div id="modalOverlay" class="hidden fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6">
      <h2 class="font-bold mb-4">Curso</h2>
      <form id="courseForm" class="space-y-4">
        <input type="hidden" id="courseId" />
        <input id="fTitle" required placeholder="Título" class="w-full border rounded-xl p-2.5 text-sm" />
        <textarea id="fDescription" placeholder="Descripción" class="w-full border rounded-xl p-2.5 text-sm"></textarea>
        <div class="flex justify-end gap-3">
          <button type="button" id="modalCancel" class="px-4 py-2.5 text-sm">Cancelar</button>
          <button type="submit" class="btn-success">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="deleteOverlay" class="hidden fixed inset-0 z-40 bg-slate-900/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm">
      <div class="p-6 text-center">
        <h3 class="font-bold">Eliminar curso</h3>
        <p class="text-sm text-slate-500 mt-2">¿Seguro que quieres eliminar?</p>
      </div>
      <div class="flex gap-3 px-6 pb-6">
        <button id="deleteCancel" class="flex-1 px-4 py-2.5 rounded-xl text-sm">Cancelar</button>
        <button id="deleteConfirm" class="btn-danger flex-1" onclick="handleDelete(course.id)">Remove</button>
      </div>
    </div>
  </div>

<script>
const API_BASE='http://localhost:3000';
let allCourses=[],deleteTarget=null;
const $=id=>document.getElementById(id);
async function api(p,o={}){const r=await fetch(`${API_BASE}${p}`,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw new Error();return r.status===204?null:r.json();}
async function loadAll(){try{const s=await api('/api/courses/stats');$('statsSection').innerHTML=`<div class="bg-white p-5 rounded-2xl border">Total: ${s.total}</div><div class="bg-white p-5 rounded-2xl border">Plan: ${s.planned}</div><div class="bg-white p-5 rounded-2xl border">Prog: ${s['in-progress']||0}</div><div class="bg-white p-5 rounded-2xl border">Comp: ${s.completed}</div>`;const d=await api('/api/courses');allCourses=Array.isArray(d)?d:d.courses||[];render();}catch(e){console.error(e);}}
function render(){const q=$('searchInput').value.toLowerCase();const f=$('statusFilter').value;const filtered=allCourses.filter(c=>(!q||c.title.toLowerCase().includes(q))&&(!f||c.status===f));if(filtered.length===0){$('coursesGrid').innerHTML='';$('emptyState').classList.remove('hidden');}else{$('emptyState').classList.add('hidden');$('coursesGrid').innerHTML=filtered.map(c=>`<div class='bg-white p-5 rounded-2xl border card-hover'><h3 class='font-bold'>${c.title}</h3><div class='flex gap-2 mt-3'><button data-edit='${c.id}' class='btn-primary text-xs'>Editar</button><button data-delete='${c.id}' class='btn-danger text-xs'>Eliminar</button></div></div>`).join('');}}
function handleDelete(id){ if(!id && deleteTarget) id=deleteTarget.id; if(confirm('Delete this course?')){fetch(`${API_BASE}/api/courses/${id}`,{method:'DELETE'}).then(()=>{closeDel();loadAll();});}}
function closeDel(){$('deleteOverlay').classList.add('hidden'); deleteTarget=null;}
$('btnNewCourse').onclick=()=>$('modalOverlay').classList.remove('hidden');
$('modalCancel').onclick=()=>$('modalOverlay').classList.add('hidden');
$('deleteCancel').onclick=closeDel;
$('deleteConfirm').onclick=()=>handleDelete();
$('coursesGrid').onclick=e=>{const ed=e.target.closest('[data-edit]');const del=e.target.closest('[data-delete]');if(del){deleteTarget=allCourses.find(x=>String(x.id)===del.dataset.delete);$('deleteOverlay').classList.remove('hidden');}};
$('searchInput').oninput=render; $('statusFilter').onchange=render;
loadAll();
</script>
</body>
</html>
